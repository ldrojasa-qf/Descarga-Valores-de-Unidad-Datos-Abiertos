[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afp-peers"
version = "0.1.0"
description = "Descarga datos abiertos SFC (datos.gov.co) y calcula peers de AFP ponderados por valor de fondo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1",
  "pyarrow>=14",
  "requests>=2.31",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
afp-peers = "afp_peers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
